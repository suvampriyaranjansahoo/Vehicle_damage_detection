services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/model/car_damage_model.h5
      MAX_UPLOAD_BYTES: 8388608
    volumes:
      - ./model:/app/model:ro
      - prediction_logs:/app/artifacts
  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
volumes:
  prediction_logs:
